name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o mitseller ./cmd/mitseller && ./mitseller version
      - name: Installer syntax
        run: bash -n install.sh
      - name: Installer tests
        run: bash tests/install/legacy_adopt_test.sh
      - name: Migration tests (mirzapanel, additional bots, mirza_pro)
        run: bash tests/install/migrate_mirza_test.sh
      - name: Cross-server move tests (bot-export/import/cutover)
        run: bash tests/install/bot_move_test.sh

      - name: Hourly backup job tests (backup-setup/backup-now)
        run: bash tests/install/backup_test.sh

      - name: set-secret tests (keeps the config readable by the service)
        run: bash tests/install/set_secret_test.sh

      - name: Update tests (a release that takes a bot down is rolled back)
        run: bash tests/install/update_test.sh

      - name: Provisioner tests (the API Mit Panel installs bots over)
        run: bash tests/install/provisioner_test.sh
